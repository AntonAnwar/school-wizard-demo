<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>بوابة الطالب</title>
<link rel="stylesheet" href="common.css"/>
</head>
<body>
<main id="app" class="page"></main>
<div id="toast-root"></div>
<div id="modal-root"></div>

<script src="common.js"></script>
<script>
"use strict";
let db=loadDB();
const ME=getSession();
if(!ME||ME.role!=='student'){ location.href='portal.html'; }
const ME_STU=studentById(db,ME.id);
const YEAR=db.school.yearLabel;
const MY_SEC=sectionByKey(db,ME_STU.sectionKey);
const TEACHER=MY_SEC?teacherOfSection(db,MY_SEC):null;
const ASGS=assignmentsForStudent(db,ME_STU);
const S={tab:'asg',openAsg:null,submitAsg:null,rc:false,chatId:null,subFile:'',subText:'',subFileData:null};

const mySub=id=>submissionFor(db,id,ME_STU.id);
const unreadN=()=>notificationsFor(db,ME.role,ME.id).filter(n=>!n.read).length;

function render(){
  if(S.rc){ renderRC(); return; }
  if(!MY_SEC){
    $('#app').innerHTML=`
    <div class="topbar" style="position:static;border-radius:12px;margin-bottom:14px">
      <span class="t">🏫 ${esc(db.school.name)}</span>
      <span class="rolebadge">🎒 ${esc(ME_STU.name)}</span>
      <a class="home" href="portal.html">← خروج</a>
    </div>
    <div class="warnbox" style="margin:10px 0">⚠️ لم تُوزَّع على شعبة بعد — لن تظهر المهام والمحادثات إلا بعد توزيعك من <a href="wiz-enroll.html" style="color:var(--p);font-weight:800">شاشة التوزيع</a>.</div>
    <div class="card"><div class="card-h">بياناتي</div>
      <div class="hint">المسار: ${PATHS_META[ME_STU.pathId]?PATHS_META[ME_STU.pathId].name:ME_STU.pathId} · المستوى: ${esc(levelName(db,ME_STU.gradeId))}
      ${ME_STU.parentId?' · وليّ الأمر: '+esc(parentById(db,ME_STU.parentId).name):' · غير مرتبط بوليّ أمر'}</div></div>`;
    return;
  }
  const pending=ASGS.filter(a=>!mySub(a.id)).length;
  const nNotes=notesOfStudent(db,ME_STU.id).length;
  const tabs=[['asg','📝 مهامي',pending||null],['grades','🎯 علاماتي',null],['notes','🗒️ ملاحظاتي',nNotes||null],['behav','⚖️ سلوكي',null],['plan','📅 الخطة الأسبوعية',null],['rc','📊 كشف نتيجتي',null],['chat','💬 محادثتي مع المربي',null],['att','🗓️ حضوري',null]];
  $('#app').innerHTML=`
  <div class="topbar" style="position:static;border-radius:12px;margin-bottom:14px">
    <span class="t">🏫 ${esc(db.school.name)}</span>
    <span class="rolebadge">🎒 ${esc(ME_STU.name)} · ${levelName(db,MY_SEC.gradeId)} / شعبة ${MY_SEC.letter}</span>
    <button class="reset" onclick="Sv.showNotifs()">🔔 الإشعارات${unreadN()?` <b style="background:var(--bad);border-radius:99px;padding:1px 7px">(${unreadN()})</b>`:''}</button>
    <a class="home" href="portal.html">← خروج</a>
  </div>
  <div class="tabs no-print">${tabs.map(([id,t,c])=>`<span class="tab ${S.tab===id?'on':''}" onclick="Sv.setTab('${id}')">${t}${c!=null?`<span class="cnt">${c}</span>`:''}</span>`).join('')}</div>
  `+({asg:tabAsg,grades:tabGrades,notes:tabNotes,behav:tabBehav,plan:tabPlan,rc:tabRcList,chat:tabChat,att:tabAtt}[S.tab])();
}

function tabPlan(){
  const plans=plansOfSection(db,ME_STU.sectionKey);
  return plans.length?`
  <div class="hint" style="margin-bottom:10px">خطط الأسابيع التي ينشرها معلمو شعبتك (الأحدث أولًا) — اضغط على الملف لتحميله.</div>
  ${plans.map(pl=>{
    const t=teacherById(db,pl.teacherId);
    return `
    <div class="card">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <span class="stchip info" style="min-width:150px;text-align:center">${esc(pl.weekLabel)}</span>
        <span class="stchip gray">${esc(pl.subject)}</span>
        <span class="hint" style="margin-inline-start:auto">${t?esc(t.name):'—'} · ${pl.at}</span>
      </div>
      ${pl.text?`<div style="margin-top:9px;font-size:13.5px;font-weight:600;line-height:1.7">${esc(pl.text)}</div>`:''}
      ${pl.fileName?`<div style="margin-top:9px">${fileLinkHtml(pl.fileName,pl.fileData)}</div>`:''}
    </div>`;
  }).join('')}`:'<div class="empty"><div class="ic">📅</div><b>لم تُنشر خطط أسبوعية لشعبتك بعد</b><p>عندما ينشر معلموك خطة أسبوعية ستجدها هنا مع إشعار فوري.</p></div>';
}

function tabBehav(){
  const info=studentBehavior(db,ME_STU.id);
  const recs=(db.behaviorRecords||[]).filter(r=>r.studentId===ME_STU.id).sort((a,b)=>b.at.localeCompare(a.at));
  const bar=(cur,target,good)=>{
    const p=target?Math.min(100,Math.round(cur/target*100)):100;
    return `<div style="flex:1;min-width:150px">
      <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:4px">
        <span style="color:${good?'#059669':'#DC2626'}">${good?'+':'−'}${Math.abs(cur)} نقطة</span>
        <span class="hint">${target?('الحد التالي: '+(good?'+':'−')+target):'وصل للحد الأقصى'}</span>
      </div>
      <div style="height:8px;background:#E5E7EB;border-radius:99px;overflow:hidden"><div style="height:100%;width:${p}%;background:${good?'var(--ok)':'var(--bad)'};border-radius:99px"></div></div>
    </div>`;
  };
  return `
  <div class="card">
    <div class="card-h">📈 نقاطي السلوكية</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      ${bar(info.negAbs,info.nextNeg,false)}
      ${bar(info.pos,info.nextPos,true)}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <span class="stchip ${STAGE_META[info.stage]?STAGE_META[info.stage].cls:'ok'}">${info.stage?('⚠️ المرحلة: '+info.stageName):'✅ سلوك سليم'}</span>
      <span class="stchip ${info.level?'info':'gray'}">${info.level?('🏆 '+info.levelName):'لا مستوى إيجابي بعد'}</span>
    </div>
    ${info.awards.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
      ${info.awards.map(aw=>`<span class="stchip ok">🏆 ${aw.name} — ${esc(aw.reward)} (${aw.at})</span>`).join('')}
    </div>`:''}
  </div>
  <div class="card" style="margin-top:12px">
    <div class="card-h">📊 نقاطي حسب التصنيف</div>
    ${info.byCategory.length?`
    <table class="tbl">
      <tr><th>التصنيف</th><th>سجلات</th><th>سلبي</th><th>إيجابي</th></tr>
      ${info.byCategory.map(c=>`<tr><td>${esc(c.category)}</td><td>${c.count}</td>
        <td style="color:${c.neg<0?'#DC2626':'var(--faint)'};font-weight:800">${c.neg<0?c.neg:'—'}</td>
        <td style="color:${c.pos>0?'#059669':'var(--faint)'};font-weight:800">${c.pos>0?'+'+c.pos:'—'}</td></tr>`).join('')}
      <tr><td><b>الإجمالي</b></td><td>${info.records}</td><td style="color:#DC2626;font-weight:800">${info.neg}</td><td style="color:#059669;font-weight:800">+${info.pos}</td></tr>
    </table>`:'<div class="hint">لا سجلات بعد.</div>'}
  </div>
  ${info.incidents.length?`
  <div class="card" style="margin-top:12px">
    <div class="card-h">⚠️ حالات المتابعة السلوكية</div>
    ${info.incidents.map(inc=>`
    <div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap">
      <span class="stchip ${STAGE_META[inc.stage].cls}">${STAGE_META[inc.stage].t}</span>
      <b style="flex:1">${inc.at} — ${esc(inc.action)}</b>
      ${inc.status==='open'?'<span class="stchip warn">قيد المتابعة</span>':'<span class="stchip ok">✓ أُغلقت</span>'}
    </div>`).join('')}
  </div>`:''}
  <div class="card" style="margin-top:12px">
    <div class="card-h">🕘 سجل سلوكي (${recs.length})</div>
    ${recs.map(r=>{
      const t=teacherById(db,r.teacherId);
      return `<div style="display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)">
        <span class="stchip ${r.kind==='negative'?'bad':'ok'}" style="min-width:44px;text-align:center">${r.kind==='negative'?'-'+r.points:'+'+r.points}</span>
        <div style="flex:1"><b style="font-size:13px">${esc(r.behaviorName)}</b> <span class="stchip gray">${esc(r.category)}</span>
          <div class="hint">${t?esc(t.name):'—'} · ${r.at}${r.note?' · '+esc(r.note):''}${r.action?' · الإجراء: '+esc(r.action):''}</div></div>
      </div>`;
    }).join('')||'<div class="hint">لا سجلات — سجل معلموك سلوكك هنا.</div>'}
  </div>`;
}

function tabNotes(){
  const ns=notesOfStudent(db,ME_STU.id);
  return ns.length?ns.map(n=>{
    const t=teacherById(db,n.teacherId);
    return `
    <div class="card" style="padding:12px 16px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <span class="stchip ${NOTE_KINDS[n.kind]?NOTE_KINDS[n.kind].cls:'gray'}">${NOTE_KINDS[n.kind]?NOTE_KINDS[n.kind].ic:''} ${NOTE_KINDS[n.kind]?NOTE_KINDS[n.kind].t:'ملاحظة'}</span>
        <span class="stchip info">${esc(n.subject)}</span>
        <span class="hint">${t?esc(t.name):'معلم'} · ${n.at}</span>
      </div>
      <div style="margin-top:8px;font-size:14px;font-weight:700">${esc(n.text)}</div>
    </div>`;
  }).join(''):'<div class="empty" style="margin-top:10px"><div class="ic">🗒️</div><b>لا ملاحظات بعد</b><p>تظهر هنا الملاحظات الأكاديمية والسلوكية التي يسجلها معلموك عليك — ويرى وليّ أمرك نفس الشيء.</p></div>';
}

function tabAsg(){
  return (ASGS.length?ASGS.map(a=>{
    const sub=mySub(a.id);
    const late=!sub&&a.dueDate<todayStr();
    const chip=sub? (sub.status==='graded'?`<span class="stchip ok">مُقيَّم: ${sub.score}/${a.maxScore}</span>`:'<span class="stchip warn">سُلِّم — بانتظار التقييم</span>')
      : (late?'<span class="stchip bad">⏰ تجاوزت مهلة التسليم</span>':'<span class="stchip info">بانتظار تسليمك</span>');
    const open=S.openAsg===a.id;
    return `
    <div class="card">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div style="flex:1;min-width:220px">
          <span class="stchip info">${esc(a.subject)}</span>
          <span class="stchip ${a.type==='assessment'?'warn':'gray'}">${ASG_TYPES[a.type].t}</span>
          <b style="display:block;font-size:15px;margin-top:7px">${esc(a.title)}</b>
          <div class="hint" style="margin-top:4px">تسليم: <b>${a.dueDate}</b> · الدرجة العظمى: ${a.maxScore} · المعلم: ${esc(teacherById(db,a.teacherId)?teacherById(db,a.teacherId).name:'—')}</div>
        </div>
        ${chip}
        <div style="display:flex;gap:8px">
          ${sub?'<button class="btn ghost" onclick="Sv.openAsg(\''+a.id+'\')">عرض التفاصيل</button>'
               :'<button class="btn primary" onclick="Sv.openSubmit(\''+a.id+'\')">✍️ تسليم المهمة</button>'}
          <button class="btn outline-p" onclick="Sv.openAsg('${a.id}')">التفاصيل</button>
        </div>
      </div>
      ${open?`
      <div style="border-top:1px dashed var(--line);margin-top:12px;padding-top:12px">
        <div class="hint" style="font-size:13px"><b>📌 التعليمات:</b> ${esc(a.instructions)||'—'}</div>
        ${a.resources.length?`<div style="margin-top:8px"><b style="font-size:12.5px">📎 الموارد (اضغط للتحميل):</b>
          ${a.resources.map(r=>`<span style="margin-inline-start:10px">${fileLinkHtml(r.name,r.fileData||r.url)}</span>`).join('')}</div>`:''}
        ${sub?`
        <div style="margin-top:10px;background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600">
          <b>تسليمي:</b> ${sub.submittedAt}${sub.fileName?' · '+fileLinkHtml(sub.fileName,sub.fileData||null):''}
          ${sub.content?'<br/><span style="color:var(--mut)">'+esc(sub.content)+'</span>':''}
          ${sub.status==='graded'?`
          <div style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
            <span class="stchip ${sub.score/a.maxScore>=0.5?'ok':'bad'}">الدرجة: ${sub.score} / ${a.maxScore}</span>
            ${sub.feedback?`<span style="color:var(--mut)"><b>💬 ملاحظة المعلم:</b> ${esc(sub.feedback)}</span>`:''}
          </div>`:''}
        </div>`:`<div class="hint" style="margin-top:10px">لم تسُلِّم بعد — زر «✍️ تسليم المهمة».</div>`}
      </div>`:''}
    </div>`;
  }).join(''):'<div class="empty" style="margin-top:10px"><div class="ic"></div><b>لا مهام لشعبتك بعد</b><p>عندما ينشر معلموك مهامًا أو اختبارات ستجدها هنا.</p></div>')
    + (S.submitAsg?`
    <div class="overlay" onclick="if(event.target===this)Sv.closeSubmit()">
      <div class="modal" style="max-width:520px">
        <h3>✍️ تسليم: ${esc((ASGS.find(a=>a.id===S.submitAsg)||{}).title||'')}</h3>
        <label class="mlabel">1) ارفع ملف إجاباتك (اختياري)</label>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label class="btn outline-p" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px">
            📎 اختر ملفًا (PDF/Word/صورة — حتى 1MB)
            <input type="file" style="display:none" onchange="Sv.subFilePick(this)"/>
          </label>
          ${S.subFileData?`<span class="stchip ok">📎 ${esc(S.subFileData.name)} (${Math.round(S.subFileData.data.length/1024)} KB)</span>
          <button class="btn tiny ghost" onclick="Sv.subFileClear()">✕ إزالة</button>`:''}
        </div>
        <label class="mlabel">2) أو اكتب إجابتك هنا (اختياري)</label>
        <textarea class="din" style="width:100%;min-height:100px" placeholder="اكتب إجابتك أو ملاحظتك هنا…" onchange="Sv.subText(this.value)">${esc(S.subText)}</textarea>
        <p class="hint" style="margin-top:8px">يمكنك رفع ملف، أو كتابة نص، أو كليهما. يصل المعلم إشعارًا بالتسليم فورًا — ويصل <b>وليّ أمرك</b> إشعارًا أيضًا.</p>
        <div class="row" style="margin-top:16px">
          <button class="btn ghost" onclick="Sv.closeSubmit()">إلغاء</button>
          <button class="btn primary" onclick="Sv.doSubmit()">تسليم الآن</button>
        </div>
      </div></div>`:'');
}

function tabGrades(){
  const gs=gradesOfStudent(db,ME_STU.id);
  const per={};
  gs.forEach(g=>{ (per[g.subject]=per[g.subject]||{s:0,m:0}); per[g.subject].s+=g.score; per[g.subject].m+=g.max; });
  return `
  ${gs.length?`
  <div class="card" style="padding:6px 14px">
    ${gs.map(g=>`
    <div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap;font-size:13.5px">
      <span class="stchip info">${esc(g.subject)}</span>
      <b style="flex:1;min-width:160px">${esc(g.title)}</b>
      <span class="stchip ${g.type==='assessment'?'warn':'gray'}">${g.type==='assessment'?'اختبار':'مهمة'}</span>
      <b style="color:${g.score/g.max>=0.5?'#059669':'#DC2626'};font-size:15px">${g.score}/${g.max}</b>
      ${g.feedback?`<span style="color:var(--mut);font-size:12.5px">💬 ${esc(g.feedback)}</span>`:''}
    </div>`).join('')}
  </div>
  <div class="card" style="margin-top:12px">
    <div class="card-h">متوسطي بالمادة</div>
    ${Object.entries(per).map(([sub,v])=>{const p=Math.round(v.s/v.m*100);
      return `<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-weight:700">
        <b style="min-width:130px">${esc(sub)}</b>
        <span style="flex:1;height:8px;background:#E5E7EB;border-radius:99px;display:block"><span style="display:block;height:100%;width:${p}%;background:${p>=50?'var(--ok)':'var(--bad)'};border-radius:99px"></span></span>
        <b>${p}%</b></div>`;}).join('')}
  </div>`
  :'<div class="empty" style="margin-top:10px"><div class="ic">🎯</div><b>لا علامات بعد</b><p>تظهر علاماتك هنا عندما يقيّم معلموك تسليماتك.</p></div>'}`;
}

function tabRcList(){
  return `
  <div class="card" style="text-align:center;padding:30px">
    <div style="font-size:40px">📊</div>
    <b style="font-size:16px;display:block;margin-top:8px">كشف نتائجي</b>
    <p class="hint" style="margin:8px 0 16px">يشاركه معي وليّ أمري — قابل للطباعة أو الحفظ PDF.</p>
    <button class="btn primary" onclick="Sv.openRc()">فتح كشف النتائج ←</button>
  </div>`;
}
function renderRC(){
  const rc=reportCardData(db,ME_STU.id);
  if(!rc){ S.rc=false; render(); return; }
  const s=rc.student, sec=rc.section, t=sec?teacherOfSection(db,sec):null;
  $('#app').innerHTML=`
  <div class="topbar" style="position:static;border-radius:12px;margin-bottom:14px">
    <span class="t">📊 كشف نتائجي</span>
    <button class="reset no-print" onclick="Sv.closeRc()">← رجوع</button>
  </div>
  <div class="rc">
    <div class="rc-head">
      <div><b>🏫 ${esc(db.school.name)}</b><br/><span style="font-size:12.5px;opacity:.85">كشف نتائج — ${YEAR}</span></div>
      <button class="btn primary no-print" onclick="window.print()">🖨️ طباعة / حفظ PDF</button>
    </div>
    <div class="rc-body">
      <div class="rc-grid">
        <div class="rc-cell">الطالب<b>${esc(s.name)}</b></div>
        <div class="rc-cell">الصف / الشعبة<b>${sec?levelName(db,sec.gradeId)+' / شعبة '+sec.letter:'—'}</b></div>
        <div class="rc-cell">مربّي الصف<b>${t?t.name:'—'}</b></div>
        <div class="rc-cell">وليّ الأمر<b>${rc.parent?rc.parent.name:'غير مرتبط'}</b></div>
        <div class="rc-cell">النتيجة العامة<b style="color:${rc.overall!=null&&rc.overall>=50?'#059669':'#DC2626'}">${rc.overall!=null?rc.overall+'%':'—'}</b></div>
        <div class="rc-cell">النقاط السلوكية<b>سلبي ${rc.behavior.neg} / إيجابي +${rc.behavior.pos}</b></div>
        <div class="rc-cell">الوضع السلوكي<b>${rc.behavior.stage?('⚠️ '+rc.behavior.stageName):'✅ سليم'}${rc.behavior.level?' · 🏆 '+rc.behavior.levelName:''}</div>
      </div>
      <table class="tbl">
        <tr><th>المادة</th><th>المقيَّم</th><th>النسبة</th></tr>
        ${rc.per.map(r=>`<tr><td>${esc(r.subject)}</td><td>${r.n}</td><td><b style="color:${r.avg>=50?'#059669':'#DC2626'}">${r.avg}%</b></td></tr>`).join('')
        ||'<tr><td colspan="3" style="color:var(--faint)">لا علامات مقيَّمة بعد</td></tr>'}
      </table>
      <div class="rc-grid" style="margin-top:14px">
        <div class="rc-cell">حاضر<b style="color:#059669">${rc.att.present}</b></div>
        <div class="rc-cell">غائب<b style="color:#DC2626">${rc.att.absent}</b></div>
        <div class="rc-cell">متأخر<b style="color:#B45309">${rc.att.late}</b></div>
        <div class="rc-cell">بعذر<b style="color:#1E40AF">${rc.att.excused}</b></div>
      </div>
    </div>
    <div class="rc-foot"><span>توقيع المعلم: ........................</span><span>توقيع وليّ الأمر: ........................</span><span>${todayStr()}</span></div>
  </div>`;
}

function tabChat(){
  const c=findConversation(db,{role:'student',id:ME_STU.id},{role:'teacher',id:TEACHER.id});
  const msgsHtml=c?c.messages.map(m=>{ const mine=m.from.role==='student'&&m.from.id===ME_STU.id;
    return `<div class="msg ${mine?'me':'them'}">${esc(m.text)}<span class="mt">${mine?'أنت':esc(TEACHER.name)} · ${m.at}</span></div>`;
  }).join(''):'<div class="hint" style="text-align:center;padding:30px 0">لا رسائل بعد — ابدأ المحادثة 👇</div>';
  return `
  <div class="card">
    <div class="card-h">💬 محادثتي الفردية مع مربّي الصف
      <span class="stchip gray" style="margin-inline-start:8px">${esc(TEACHER.name)} — ${esc(TEACHER.subject||'معلم')}</span>
    </div>
    <div class="msgs" id="msgs">${msgsHtml}</div>
    <div class="chatinput">
      <input id="chatbox" type="text" placeholder="اكتب رسالتك لمربّي صفك…" onkeydown="if(event.key==='Enter')Sv.sendMsg()"/>
      <button class="btn primary" onclick="Sv.sendMsg()">إرسال</button>
    </div>
  </div>`;
}

function tabAtt(){
  const sum=attendanceSummary(db,ME_STU.id);
  const recs=recentAttendance(db,ME_STU.id,10);
  return `
  <div class="pbar2" style="justify-content:center">
    <span class="stchip ok" style="font-size:13px">حاضر: ${sum.present}</span>
    <span class="stchip bad" style="font-size:13px">غائب: ${sum.absent}</span>
    <span class="stchip warn" style="font-size:13px">متأخر: ${sum.late}</span>
    <span class="stchip info" style="font-size:13px">بعذر: ${sum.excused}</span>
  </div>
  <div class="card">
    <div class="card-h">آخر السجلات</div>
    ${recs.map(r=>`<div style="display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px;font-weight:700">
      <b style="min-width:105px">${r.date}</b>
      <span class="stchip ${ATT_META[r.status].cls}">${ATT_META[r.status].t}</span>
      ${r.excuseType?`<span style="color:var(--mut)">(العبء: ${esc(r.excuseType)})</span>`:''}
      ${r.notified?'<span class="stchip gray" style="margin-inline-start:auto">أُشعر وليّ الأمر</span>':''}
    </div>`).join('')||'<div class="hint">لا سجلات حضور بعد.</div>'}
  </div>`;
}

const Sv={
  setTab(t){ S.tab=t; S.openAsg=null; render(); },
  openAsg(id){ S.openAsg=S.openAsg===id?null:id; render(); },
  openSubmit(id){ S.submitAsg=id; S.subFile=''; S.subText=''; S.subFileData=null; S.openAsg=null; render(); },
  closeSubmit(){ S.submitAsg=null; render(); },
  subFile(v){ S.subFile=v; },
  subText(v){ S.subText=v; },
  subFilePick(input){
    pickFileEl(input,f=>{ S.subFileData=f; render(); toast(`📎 جاهز للإرسال: ${f.name} (${Math.round(f.data.length/1024)} KB)`,{type:'ok'}); },
      e=>toast(e,{type:'warn'}));
  },
  subFileClear(){ S.subFileData=null; render(); },
  doSubmit(){
    if(!S.submitAsg) return;
    if(!S.subFileData&&!S.subText.trim()){ toast('ارفع ملفًا أو اكتب إجابتك أولًا',{type:'warn'}); return; }
    const a=ASGS.find(x=>x.id===S.submitAsg);
    const sub=submitAssignment(db,S.submitAsg,ME_STU.id,{
      fileName:S.subFileData?S.subFileData.name:(S.subFile.trim()||null),
      content:S.subText.trim(),
      fileData:S.subFileData?S.subFileData.data:null});
    notifyOnSubmit(db,sub);
    S.submitAsg=null; S.subFileData=null; S.subText=''; S.openAsg=a?a.id:null; render();
    toast(`✍️ سُلِّمت «${a?a.title:''}» — أُرسل إشعار للمعلم ولوليّ أمرك`,{type:'ok'});
  },
  openRc(){ S.rc=true; render(); },
  closeRc(){ S.rc=false; render(); },
  sendMsg(){
    const el=document.getElementById('chatbox');
    if(!el||!el.value.trim()||!TEACHER) return;
    const c=startConversation(db,{role:'student',id:ME_STU.id},{role:'teacher',id:TEACHER.id});
    addMessage(db,c.id,{role:'student',id:ME_STU.id},el.value.trim());
    render();
    const m=document.getElementById('msgs'); if(m)m.scrollTop=m.scrollHeight;
  },
  showNotifs(){
    const ns=notificationsFor(db,ME.role,ME.id).sort((a,b)=>b.at.localeCompare(a.at));
    $('#modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)Sv.closeModal()">
      <div class="modal"><h3>🔔 إشعاراتي</h3>
      ${ns.map(n=>`<div class="notif ${n.read?'':'unread'}">${esc(n.text)}<span class="t">${n.at}</span></div>`).join('')||'<div class="hint">لا إشعارات</div>'}
      <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="Sv.closeModal()">إغلاق</button></div></div></div>`;
  },
  closeModal(){ $('#modal-root').innerHTML=''; }
};
render();
</script>
</body>
</html>
